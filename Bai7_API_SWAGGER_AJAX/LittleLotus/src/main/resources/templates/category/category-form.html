<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${formTitle}"></title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4" th:text="${formTitle}">Thêm/Sửa Danh mục</h2>
        
        <div class="container col-md-8 col-lg-6 p-4" style="background-color: var(--color-background-card); border-radius: var(--border-radius-large);">
            <form action="#" th:action="@{/admin/category/save}" th:object="${category}" method="POST">
                
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-4">
                    <label for="name" class="form-label fw-bold">Tên Danh mục:</label>
                    <input type="text" th:field="*{name}" id="name" class="form-control" placeholder="Ví dụ: Quần Áo Nữ, Phụ Kiện..." required>
                </div>
                
                <div class="mb-4">
                    <label for="description" class="form-label fw-bold">Mô tả:</label>
                    <textarea th:field="*{description}" id="description" class="form-control" rows="4" placeholder="Mô tả chi tiết về danh mục này..."></textarea>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary me-3">
                        <i class="fas fa-save me-1"></i> Lưu Danh mục
                    </button>
                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">
                        <i class="fas fa-ban me-1"></i> Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
